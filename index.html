<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Register of Uses — Review Copies</title>
<style>
  :root{
    --bg:#faf8f3; --panel:#ffffff; --ink:#23201b; --muted:#6b6256;
    --line:#e7e0d3; --accent:#8a5a2b; --accent-soft:#f0e6d6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg); display:flex; min-height:100vh;
  }
  /* Sidebar */
  #nav{
    width:280px; flex:0 0 280px; background:var(--panel); border-right:1px solid var(--line);
    padding:22px 18px; overflow-y:auto; position:sticky; top:0; height:100vh;
  }
  #nav h1{font-size:15px; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); margin:0 0 4px;}
  #nav .sub{font-size:12px; color:var(--muted); margin-bottom:18px; line-height:1.4;}
  #nav a{
    display:block; text-decoration:none; color:var(--ink); padding:10px 12px; border-radius:8px;
    font-size:14px; margin-bottom:4px; border:1px solid transparent;
  }
  #nav a:hover{background:var(--accent-soft);}
  #nav a.active{background:var(--accent-soft); border-color:var(--accent); font-weight:600;}
  #nav .tag{display:block; font-size:11px; color:var(--muted); margin-top:2px;}
  /* Content */
  #main{flex:1; overflow-y:auto; height:100vh; padding:40px 48px 96px;}
  #reader{max-width:760px; margin:0 auto;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
  .toolbar a{
    font-size:12px; color:var(--accent); text-decoration:none; border:1px solid var(--accent);
    padding:6px 12px; border-radius:6px; background:#fff;
  }
  .toolbar a:hover{background:var(--accent-soft);}
  .doc{
    font-family:Georgia,"Times New Roman",serif; font-size:18px; line-height:1.75; color:var(--ink);
  }
  .doc h1{font-size:30px; line-height:1.2; margin:0 0 .4em; border-bottom:2px solid var(--line); padding-bottom:.3em;}
  .doc h2{font-size:23px; margin:1.4em 0 .5em; color:#2c281f;}
  .doc h3{font-size:19px; margin:1.2em 0 .4em;}
  .doc p{margin:0 0 1em;}
  .doc blockquote{margin:1em 0; padding:.4em 1em; border-left:4px solid var(--accent-soft); color:var(--muted); background:#fff;}
  .doc table{border-collapse:collapse; width:100%; margin:1em 0; font-size:15px;}
  .doc th,.doc td{border:1px solid var(--line); padding:8px 10px; text-align:left;}
  .doc th{background:#f3ede0; font-weight:600;}
  .doc hr{border:none; border-top:1px solid var(--line); margin:2em 0;}
  .doc em{font-style:italic;}
  .doc code{background:#f0ece3; padding:1px 5px; border-radius:4px; font-size:.9em;}
  #status{color:var(--muted); font-size:14px;}
  @media (max-width:720px){
    body{flex-direction:column;}
    #nav{width:100%; flex:none; height:auto; position:static; border-right:none; border-bottom:1px solid var(--line);}
    #main{height:auto; padding:24px 18px 64px;}
  }
</style>
</head>
<body>
  <nav id="nav">
    <h1>The Register of Uses</h1>
    <div class="sub">Four-book gaslamp fantasy romance by Aspen Aye — review copies &amp; series notes.</div>
    <div id="links"></div>
  </nav>
  <main id="main">
    <div class="toolbar">
      <div id="status">Loading…</div>
      <a id="dl" href="#" download style="display:none;">Download .md</a>
    </div>
    <article class="doc" id="reader"></article>
  </main>

  <script src="marked.min.js"></script>
  <script>
    const DOCS = [
      { file: "The Register of Uses - Series Summary.md", title: "Series Summary & Notes", tag: "overview" },
      { file: "What She Was Made For - ReviewCopy.md", title: "Book One · What She Was Made For", tag: "33 chapters · 110,964 words" },
      { file: "What She Would Not Say - ReviewCopy.md", title: "Book Two · What She Would Not Say", tag: "30 chapters · 97,853 words" },
      { file: "The Woman They Unwrote - ReviewCopy.md", title: "Book Three · The Woman They Unwrote", tag: "30 chapters · 93,895 words" },
      { file: "Ask Me What I Want - ReviewCopy.md", title: "Book Four · Ask Me What I Want", tag: "30 chapters · 94,431 words" }
    ];

    const linksEl = document.getElementById('links');
    const readerEl = document.getElementById('reader');
    const statusEl = document.getElementById('status');
    const dlEl = document.getElementById('dl');

    DOCS.forEach((d, i) => {
      const a = document.createElement('a');
      a.href = '#';
      a.dataset.i = i;
      a.innerHTML = d.title + '<span class="tag">' + d.tag + '</span>';
      a.addEventListener('click', (e) => { e.preventDefault(); load(i); });
      linksEl.appendChild(a);
    });

    function setActive(i){
      [...linksEl.children].forEach((a, idx) => a.classList.toggle('active', idx === i));
    }

    async function load(i){
      const d = DOCS[i];
      setActive(i);
      statusEl.textContent = 'Loading ' + d.title + '…';
      dlEl.style.display = 'inline-block';
      dlEl.href = d.file;
      readerEl.innerHTML = '';
      try {
        const res = await fetch(d.file);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const md = await res.text();
        readerEl.innerHTML = marked.parse(md);
        statusEl.textContent = d.title;
        document.getElementById('main').scrollTop = 0;
      } catch (err) {
        statusEl.textContent = 'Could not load this document.';
        readerEl.innerHTML = '<p>This document could not be rendered inline. ' +
          'Use the <strong>Download .md</strong> button above to read it directly.</p>' +
          '<p>Error: ' + String(err.message) + '</p>';
      }
    }

    load(0);
  </script>
</body>
</html>
